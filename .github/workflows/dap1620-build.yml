name: Build DAP-1620 A2 OpenWrt

on:
  push:
    branches:
      - dap1620-a2-build
    paths:
      - 'dap1620-build/**'
      - '.github/workflows/dap1620-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib gettext             git libncurses-dev libssl-dev python3-setuptools rsync swig             unzip zlib1g-dev file wget curl time

      - name: Build custom firmware
        run: |
          chmod +x dap1620-build/build-dap1620.sh
          ./dap1620-build/build-dap1620.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAP1620-A2-Custom-OpenWrt
          path: artifact/
          if-no-files-found: error
          retention-days: 30
